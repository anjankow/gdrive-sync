name: Release

# Started by hand: Actions -> Release -> Run workflow, on branch main.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release (${{ inputs.bump }})
    runs-on: ubuntu-24.04
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not from ${{ github.ref_name }}"
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          version="$(scripts/next-version.sh "${{ inputs.bump }}")"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::Tag v${version} already exists"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}" >> "$GITHUB_STEP_SUMMARY"
      - name: Release notes from the changelog
        # the "Unreleased" section of CHANGELOG.md; a release without it is refused
        run: |
          scripts/changelog.sh notes Unreleased > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup
        with:
          extra-packages: dpkg-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DGDS_WERROR=ON \
            -DGDS_VERSION="${{ steps.version.outputs.version }}"
          cmake --build build
      - name: Test
        run: xvfb-run -a dbus-run-session -- ctest --test-dir build --output-on-failure --timeout 300
      - name: Build packages
        run: |
          version="${{ steps.version.outputs.version }}"
          (cd build && cpack -G DEB)
          dpkg-deb --info build/*.deb
          scripts/build-appimage.sh build "$version"
          # release files: gdrive-sync-<version>.deb and gdrive-sync-<version>.AppImage
          mkdir dist
          mv build/*.deb "dist/gdrive-sync-${version}.deb"
          mv build/*.AppImage "dist/gdrive-sync-${version}.AppImage"
          ls -l dist
      - name: Changelog, badge, tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          # "## Unreleased" becomes "## <version> – <date>"; the README badge shows the new version
          scripts/changelog.sh release "$version" "$(date -u +%Y-%m-%d)"
          sed -i -E "s|img\.shields\.io/badge/release-v[0-9]+\.[0-9]+\.[0-9]+-blue|img.shields.io/badge/release-${tag}-blue|" README.md
          # commit as the GitHub Actions bot: its no-reply address is built from its account id
          bot="github-actions[bot]"
          bot_id="$(gh api "users/${bot}" --jq .id)"
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          git commit -am "Release ${tag}"
          git pull --rebase origin main # in case main moved meanwhile
          git push origin HEAD:main
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" dist/* --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
