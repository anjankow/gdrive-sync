name: Release notes

# Started by hand: sets the notes of an existing release to its section of
# CHANGELOG.md on main (e.g. after correcting a typo there).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  notes:
    name: Notes of ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Update the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          scripts/changelog.sh notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
